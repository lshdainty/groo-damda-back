plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'io.groo.damda'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    toolVersion = '0.8.13'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    // 내부 라이브러리(io.groo)는 GitHub Packages 에서만 받는다(보안 점검 SUP-4).
    // 예전에는 mavenCentral · JitPack 을 먼저 뒤져, 누가 공개 저장소에 같은 좌표를 올리면 그 jar 가
    // 빌드에 들어갈 수 있었다. mavenLocal 은 core 를 배포 전에 로컬로 검증할 때만 쓰고, 역시 io.groo 만 본다.
    exclusiveContent {
        forRepositories(mavenLocal(), maven {
            name = "GitHubPackagesCore"
            url = uri("https://maven.pkg.github.com/lshdainty/groo-core")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key") ?: ""
            }
        })
        filter { includeGroup 'io.groo' }
    }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // ==================== Private Codes (GitHub Packages) ====================
    implementation 'io.groo:groo-core:3.3.0'

    // ==================== Spring Boot Starters ====================
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ==================== Security ====================
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT (JJWT)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // SSO RS256 토큰 검증용 JWKS (nimbus)
    implementation 'com.nimbusds:nimbus-jose-jwt:10.4'

    // ==================== Redis ====================
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ==================== Database & JPA ====================
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.1'
    runtimeOnly 'com.h2database:h2'

    // QueryDSL (Hibernate 7 + Jakarta Persistence 3.2)
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.1:jpa'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // P6Spy (SQL 로깅)
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:2.0.0'

    // ==================== Monitoring & Logging ====================
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'com.github.loki4j:loki-logback-appender:2.0.1'

    // ==================== API Documentation ====================
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    // ==================== Excel (내보내기·가져오기) ====================
    // 데이터 내보내기 — Excel(.xlsx) 생성. CSV/JSON 은 수동/Jackson(내장).
    // 데이터 가져오기 — xlsx 를 SAX 로 읽는다(FileParser). 업로드 파일을 여는 자리라 버전을 묵히지 않는다:
    // 5.3.0 은 이름이 겹치는 zip 항목을 거르지 않는 CVE-2025-31672 가 있어 5.4.0 이상이어야 한다(보안 점검 DAM-8).
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // ==================== Lombok ====================
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ==================== Test ====================
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    enabled = true
    useJUnitPlatform()
    // 테스트 JVM 타임존 고정 — 프로덕션은 UserClock 이 사용자 타임존(폴백 Asia/Seoul)으로
    // "오늘"을 판단하는데, 테스트는 기대값을 LocalDate.now()(= JVM 기본 타임존)로 만든다.
    // JVM 기본이 UTC 인 환경(CI)에서 KST 00~09 시에 돌면 두 기준의 날짜가 갈려
    // 날짜 기반 테스트(대시보드 추이·별빛·별자리)가 하루씩 어긋나 실패한다.
    jvmArgs '-Xmx2g', '-XX:+HeapDumpOnOutOfMemoryError', '-Duser.timezone=Asia/Seoul'
    finalizedBy jacocoTestReport
}

def jacocoExcludes = [
    '**/Application*',
    '**/DeskApplication*',
    '**/controller/**',
    '**/controller/dto/**',
    '**/domain/**',
    '**/Q*',
    '**/Config/**',
    '**/config/**',
    '**/type/**',
    '**/security/**',
    '**/service/dto/**',
    '**/repository/dto/**',
    '**/exception/**',
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: jacocoExcludes)
                })
        )
    }
    // 테스트 기반 완성 → 커버리지 회귀 floor 게이트 활성화.
    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    enabled = true
    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: jacocoExcludes)
                })
        )
    }
    violationRules {
        // 회귀 방지 floor: 측정 스코프(service·repository 등 — controller/domain/dto/config/security 제외)의
        // 전체 LINE 커버리지가 floor 아래로 떨어지면 빌드 실패시킨다.
        // 증권 연동 작업으로 테스트가 늘어 실측 ~71.8% → floor 0.50→0.70 상향(2%p 미만 버퍼).
        // **버퍼가 얇다** — 측정 스코프(service·repository)에 테스트 없는 클래스를 200줄쯤
        // 더하면 바로 깨진다. 새 서비스를 만들면 테스트를 같은 PR 에 넣어라.
        // 클래스 단위 강제(예전 CLASS 0.60)는 미달 클래스에서 즉시 깨지므로 BUNDLE 집계 기준으로 둔다.
        rule {
            enabled = true
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

// QueryDsl 설정
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean.doLast {
    file(querydslDir).deleteDir()
}

clean {
    delete file('src/main/generated')
}
