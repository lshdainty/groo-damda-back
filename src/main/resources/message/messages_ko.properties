# 파라미터 이름({0})을 문구에서 뺐다 — `id`·`year` 는 코드 이름이라 쓰는 사람에겐 뜻이 없고
# API 구조만 드러낸다(QA 2026-09-04 #75). 이름은 RequestValueExceptionHandler 의 log.warn 에만 남는다.
# 이 두 값에는 작은따옴표를 쓰지 마라 — 인자를 넘기면 MessageFormat 이 따옴표를 인용부호로 먹는다.
error.common.missing.parameter=요청에 빠진 값이 있어요
error.common.validation.failed=유효성 검증에 실패했어요
error.common.concurrent.modification=다른 곳에서 먼저 수정됐어요. 새로고침 후 다시 시도해주세요
error.common.invalid.date.value=올바른 날짜가 아니에요
error.common.malformed.request.body=요청 형식이 올바르지 않아요
error.common.method.not.allowed=이 주소에서는 쓸 수 없는 요청 방식이에요
error.common.invalid.parameter.value=요청 값이 올바르지 않아요
# DB 제약 위반이 공통 핸들러까지 온 자리(QA 2026-09-07 #81). 어느 컬럼인지는 쓰지 않는다 —
# `event_type` 같은 내부 이름은 쓰는 사람에게 뜻이 없다(QA #75). 이름은 로그에만 남는다.
error.common.required.value.missing=요청에 빠진 값이 있어요. 입력을 확인해주세요
