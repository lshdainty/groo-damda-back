# core 번들(core-messages_ko)에도 있는 키 — 여기 값이 이긴다(application.yml basename 순서).
# core 의 GlobalExceptionHandler·시큐리티 핸들러가 이 키로 답하는데 core 값은 격식체라,
# 덮지 않으면 같은 API 가 상황에 따라 두 말투를 쓴다(QA 2026-09-03 #74).
