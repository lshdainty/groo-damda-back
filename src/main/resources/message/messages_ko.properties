# Notification (알림 — QA 2026-09-04 #76)
# 알림 문구는 응답과 달리 DB 에 문자열로 굳는다. 저장 시점의 로케일로 렌더하고, 요청이 없는
# 스케줄러에서는 NotificationMessages.FALLBACK(한국어)로 굳는다. 이미 저장된 알림은 소급되지 않는다.
# 예산 초과·경고는 거래 저장 직후(ExpenseServiceImpl)와 매일 09:00 배치
# (NotificationTriggerScheduler)가 같은 키를 쓴다 — 종전엔 두 곳이 다른 문장·다른 말투였다.
